apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
  namespace: glance
data:
  glance.yml: |
    server:
      assets-path: /app/config

    theme:
      background-color: 230 25 7
      primary-color: 265 85 65
      positive-color: 150 60 45
      negative-color: 350 75 55
      contrast-multiplier: 1.15
      custom-css-file: /assets/custom.css

    pages:
      - name: Home
        hide-desktop-navigation: true
        hide-mobile-navigation: true
        columns:
          - size: small
            widgets:
              - type: custom-api
                title: System
                hide-header: true
                cache: 30s
                subrequests:
                  cpu:
                    url: http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/api/v1/query
                    parameters:
                      query: (100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) or vector(0)
                  mem:
                    url: http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/api/v1/query
                    parameters:
                      query: ((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100) or vector(0)
                  disk:
                    url: http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/api/v1/query
                    parameters:
                      query: (100 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100)) or vector(0)
                template: |
                  {{ $cpuVal := (.Subrequest "cpu").JSON.Float "data.result.0.value.1" }}
                  {{ $memVal := (.Subrequest "mem").JSON.Float "data.result.0.value.1" }}
                  {{ $diskVal := (.Subrequest "disk").JSON.Float "data.result.0.value.1" }}
                  <div class="flex justify-between text-center">
                    <div>
                      <div class="size-h3 {{ if gt $cpuVal 85.0 }}color-negative{{ else }}color-highlight{{ end }}">{{ printf "%.0f%%" $cpuVal }}</div>
                      <div class="size-h6">CPU</div>
                    </div>
                    <div>
                      <div class="size-h3 {{ if gt $memVal 90.0 }}color-negative{{ else }}color-highlight{{ end }}">{{ printf "%.0f%%" $memVal }}</div>
                      <div class="size-h6">MEM</div>
                    </div>
                    <div>
                      <div class="size-h3 {{ if gt $diskVal 85.0 }}color-negative{{ else }}color-highlight{{ end }}">{{ printf "%.0f%%" $diskVal }}</div>
                      <div class="size-h6">DISK</div>
                    </div>
                  </div>

              - type: calendar
                first-day-of-week: monday

              - type: weather
                location: Dublin, Ireland
                units: metric
                hour-format: 24h

              - type: clock
                hour-format: 24h
                timezones:
                  - timezone: America/New_York
                    label: New York
                  - timezone: America/New_York
                    label: East US
                  - timezone: America/Los_Angeles
                    label: West US
                  - timezone: Asia/Kolkata
                    label: Hyderabad

              - type: custom-api
                title: xkcd
                hide-header: true
                cache: 6h
                url: https://xkcd.com/info.0.json
                template: |
                  <a href="https://xkcd.com/{{ .JSON.Int "num" }}/" target="_blank" rel="noreferrer">
                    <img src="{{ .JSON.String "img" }}" title="{{ .JSON.String "alt" }}" style="width:100%;border-radius:10px;">
                  </a>

          - size: full
            widgets:
              - type: bookmarks
                hide-header: true
                groups:
                  - title: Homelab
                    color: 265 85 65
                    links:
                      - title: Forgejo
                        url: https://forgejo.aiectomy.xyz
                        icon: si:forgejo
                      - title: Grafana
                        url: https://grafana.aiectomy.xyz
                        icon: si:grafana
                      - title: Alertmanager
                        url: https://alertmanager.aiectomy.xyz
                      - title: Habits
                        url: https://habits.aiectomy.xyz
                  - title: Media
                    color: 265 85 65
                    links:
                      - title: Plex
                        url: https://plex.aiectomy.xyz
                        icon: si:plex
                      - title: qBittorrent
                        url: https://qbittorrent.aiectomy.xyz
                        icon: si:qbittorrent

              - type: group
                widgets:
                  - type: custom-api
                    title: Homelab
                    cache: 10m
                    url: https://api.github.com/repos/brk3/homelab/commits?per_page=20
                    headers:
                      Accept: application/vnd.github+json
                    template: |
                      <ul class="list collapsible-container" data-collapse-after="5" style="--list-gap: 12px;">
                        {{ range $c := .JSON.Array "" }}
                          <li>
                            <a href="{{ $c.String "html_url" }}" target="_blank" rel="noreferrer" class="color-highlight text-truncate block">{{ $c.String "commit.message" }}</a>
                            <div class="size-h6 color-subdue">{{ $c.String "commit.author.name" }}</div>
                          </li>
                        {{ end }}
                      </ul>
                  - type: custom-api
                    title: Ogma
                    cache: 10m
                    url: https://api.github.com/repos/brk3/ogma/commits?per_page=20
                    headers:
                      Accept: application/vnd.github+json
                    template: |
                      <ul class="list collapsible-container" data-collapse-after="5" style="--list-gap: 12px;">
                        {{ range $c := .JSON.Array "" }}
                          <li>
                            <a href="{{ $c.String "html_url" }}" target="_blank" rel="noreferrer" class="color-highlight text-truncate block">{{ $c.String "commit.message" }}</a>
                            <div class="size-h6 color-subdue">{{ $c.String "commit.author.name" }}</div>
                          </li>
                        {{ end }}
                      </ul>
                  - type: custom-api
                    title: Brigid
                    cache: 10m
                    url: https://api.github.com/repos/brk3/brigid/commits?per_page=20
                    headers:
                      Accept: application/vnd.github+json
                    template: |
                      <ul class="list collapsible-container" data-collapse-after="5" style="--list-gap: 12px;">
                        {{ range $c := .JSON.Array "" }}
                          <li>
                            <a href="{{ $c.String "html_url" }}" target="_blank" rel="noreferrer" class="color-highlight text-truncate block">{{ $c.String "commit.message" }}</a>
                            <div class="size-h6 color-subdue">{{ $c.String "commit.author.name" }}</div>
                          </li>
                        {{ end }}
                      </ul>

              - type: group
                widgets:
                  - type: hacker-news
                  - type: lobsters
                  - type: rss
                    title: BBC News
                    feeds:
                      - url: https://feeds.bbci.co.uk/news/rss.xml
                        title: BBC News

              - type: monitor
                title: Homelab services
                hide-header: true
                cache: 1m
                sites:
                  - title: Forgejo
                    url: https://forgejo.aiectomy.xyz
                  - title: Habits
                    url: https://habits.aiectomy.xyz
                  - title: Plex
                    url: https://plex.aiectomy.xyz
                    check-url: https://plex.aiectomy.xyz/identity
                  - title: qBittorrent
                    url: https://qbittorrent.aiectomy.xyz
                  - title: Grafana
                    url: https://grafana.aiectomy.xyz
                  - title: Alertmanager
                    url: https://alertmanager.aiectomy.xyz

              - type: custom-api
                title: qBittorrent
                hide-header: true
                cache: 10s
                options:
                  view: "detailed"
                  mode: "upload"
                subrequests:
                  transfer:
                    url: http://${QBITTORRENT_IP}/api/v2/transfer/info
                  seeding:
                    url: http://${QBITTORRENT_IP}/api/v2/torrents/info
                    parameters:
                      filter: seeding
                  leeching:
                    url: http://${QBITTORRENT_IP}/api/v2/torrents/info
                    parameters:
                      filter: downloading
                template: |
                  {{ $transfer := .Subrequest "transfer" }}
                  {{ $seeding := .Subrequest "seeding" }}
                  {{ $leeching := .Subrequest "leeching" }}

                  {{ if and (eq $transfer.Response.StatusCode 200) (eq $seeding.Response.StatusCode 200) (eq $leeching.Response.StatusCode 200) }}

                    {{ $isDetailed := eq (.Options.StringOr "view" "detailed") "detailed" }}
                    {{ $mode := .Options.StringOr "mode" "default" }}

                    {{ if $isDetailed }}
                    <div class="list" style="--list-gap: 15px;">
                      <div class="flex justify-between text-center">
                        <div>
                          {{ $dlSpeed := $transfer.JSON.Float "dl_info_speed" }}
                          {{ if eq $mode "upload" }}
                            <div class="color-highlight size-h3">{{ printf "%.1f MB/s" (div $dlSpeed 1000000.0) }}</div>
                          {{ else }}
                            {{ if lt $dlSpeed 1048576.0 }}
                              <div class="color-highlight size-h3">{{ printf "%.0f KiB/s" (div $dlSpeed 1024.0) }}</div>
                            {{ else }}
                              <div class="color-highlight size-h3">{{ printf "%.1f MiB/s" (div $dlSpeed 1048576.0) }}</div>
                            {{ end }}
                          {{ end }}
                          <div class="size-h6">DOWNLOADING</div>
                        </div>

                        {{ if eq $mode "upload" }}
                        <div>
                          {{ $ulSpeed := $transfer.JSON.Float "up_info_speed" }}
                          <div class="color-highlight size-h3">{{ printf "%.1f MB/s" (div $ulSpeed 1000000.0) }}</div>
                          <div class="size-h6">UPLOADING</div>
                        </div>
                        {{ end }}

                        <div>
                          <div class="color-highlight size-h3">{{ len ($seeding.JSON.Array "") }}</div>
                          <div class="size-h6">SEEDING</div>
                        </div>

                        {{ if eq $mode "default" }}
                        <div>
                          <div class="color-highlight size-h3">{{ len ($leeching.JSON.Array "") }}</div>
                          <div class="size-h6">LEECHING</div>
                        </div>
                        {{ end }}
                      </div>

                      {{ $downloadingTorrents := $leeching.JSON.Array "" }}
                      {{ if gt (len $downloadingTorrents) 0 }}
                        <div style="margin-top: 15px;">
                          <ul class="list collapsible-container" data-collapse-after="0" style="--list-gap: 15px;">
                            {{ range $t := $downloadingTorrents }}
                              {{ $state := $t.String "state" }}
                              {{ $icon := "?" }}
                              {{ if ge ($t.Int "completed") ($t.Int "size") }}{{ $icon = "✔" }}
                              {{ else if eq $state "downloading" "forcedDL" }}{{ $icon = "↓" }}
                              {{ else if eq $state "pausedDL" "stoppedDL" "pausedUP" "stalledDL" "stalledUP" "queuedDL" "queuedUP" }}{{ $icon = "❚❚" }}
                              {{ else if eq $state "error" "missingFiles" }}{{ $icon = "!" }}
                              {{ else if eq $state "checkingDL" "checkingUP" "allocating" }}{{ $icon = "…" }}
                              {{ else if eq $state "checkingResumeData" }}{{ $icon = "⟳" }}
                              {{ end }}

                              <li class="flex items-center" style="gap: 10px;">
                                <div class="size-h4" style="flex-shrink: 0;">{{ $icon }}</div>
                                <div style="flex-grow: 1; min-width: 0;">
                                  <div class="text-truncate color-highlight">{{ $t.String "name" }}</div>
                                  <div title="{{ $t.Float "progress" | mul 100 | printf "%.1f" }}%" style="background: rgba(128, 128, 128, 0.2); border-radius: 5px; height: 6px; margin-top: 5px; overflow: hidden;">
                                    <div style="width: {{ $t.Float "progress" | mul 100 }}%; background-color: var(--color-positive); height: 100%; border-radius: 5px;"></div>
                                  </div>
                                </div>
                                <div style="flex-shrink: 0; text-align: right; width: 80px;">
                                  {{ $dlSpeed := $t.Float "dlspeed" }}
                                  <div class="size-sm color-paragraph">
                                    {{ if eq $mode "upload" }}
                                      {{ if lt $dlSpeed 1000.0 }}--{{ else }}{{ printf "%.1f MB/s" (div $dlSpeed 1000000.0) }}{{ end }}
                                    {{ else }}
                                      {{ if lt $dlSpeed 1024.0 }}--{{ else if lt $dlSpeed 1048576.0 }}{{ printf "%.0f KiB/s" (div $dlSpeed 1024.0) }}{{ else }}{{ printf "%.1f MiB/s" (div $dlSpeed 1048576.0) }}{{ end }}
                                    {{ end }}
                                  </div>
                                  {{ $eta := $t.Int "eta" }}
                                  <div class="size-sm color-paragraph">
                                    {{ if eq $eta 8640000 }}∞
                                    {{ else if gt $eta 3600 }}{{ printf "%dh %dm" (div $eta 3600) (mod (div $eta 60) 60) }}
                                    {{ else if gt $eta 0 }}{{ printf "%dm" (div $eta 60) }}
                                    {{ else }}--{{ end }}
                                  </div>
                                </div>
                              </li>
                            {{ end }}
                          </ul>
                        </div>
                      {{ end }}
                    </div>
                    {{ else }}
                    <div class="flex justify-between text-center">
                      <div>
                        {{ $dlSpeed := $transfer.JSON.Float "dl_info_speed" }}
                        <div class="color-highlight size-h3">{{ printf "%.1f MB/s" (div $dlSpeed 1000000.0) }}</div>
                        <div class="size-h6">DOWNLOADING</div>
                      </div>
                      <div>
                        <div class="color-highlight size-h3">{{ len ($seeding.JSON.Array "") }}</div>
                        <div class="size-h6">SEEDING</div>
                      </div>
                      <div>
                        <div class="color-highlight size-h3">{{ len ($leeching.JSON.Array "") }}</div>
                        <div class="size-h6">LEECHING</div>
                      </div>
                    </div>
                    {{ end }}

                  {{ else }}
                    <div class="color-negative text-center">
                      <p>Error fetching qBittorrent data.</p>
                      <p class="size-sm">Check URL and authentication bypass settings.</p>
                    </div>
                  {{ end }}

          - size: small
            widgets:
              - type: html
                source: |
                  <img src="https://cataas.com/cat?width=400" style="width:100%;border-radius:10px;">

              - type: markets
                hide-header: true
                markets:
                  - symbol: ORCL
                    name: Oracle
                  - symbol: NOW
                    name: ServiceNow

              - type: custom-api
                title: Quote of the Day
                hide-header: true
                cache: 12h
                url: https://zenquotes.io/api/today
                template: |
                  <blockquote>
                    <p>&ldquo;{{ .JSON.String "0.q" }}&rdquo;</p>
                    <footer class="color-highlight">&mdash; {{ .JSON.String "0.a" }}</footer>
                  </blockquote>

              - type: custom-api
                title: LeetCode Daily Question
                hide-header: true
                cache: 6h
                url: https://leetcode.com/graphql
                method: POST
                headers:
                  Accept: application/json
                body-type: json
                body:
                  query: |
                    query questionOfToday {
                      activeDailyCodingChallengeQuestion {
                        link
                        question {
                          questionId
                          title
                          difficulty
                        }
                      }
                    }
                  operationName: questionOfToday
                template: |
                  <div>
                    <p class="size-h4">
                      <a href="https://leetcode.com{{ .JSON.String "data.activeDailyCodingChallengeQuestion.link" }}" target="_blank">
                        {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.questionId" }}. {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.title" }}
                      </a>
                    </p>
                    <p class="size-h6 color-highlight">{{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.difficulty" }}</p>
                  </div>

              - type: custom-api
                title: Last.fm
                hide-header: true
                cache: 60s
                url: http://ws.audioscrobbler.com/2.0/
                parameters:
                  method: user.getRecentTracks
                  user: ${LASTFM_USERNAME}
                  api_key: ${LASTFM_API_KEY}
                  format: json
                  limit: 5
                template: |
                  <ul class="list list-gap-10">
                    {{ range .JSON.Array "recenttracks.track" }}
                      <li class="flex items-center gap-10">
                        <div class="flex-1">
                          <p class="color-positive size-h5">{{ .String "artist.#text" }}</p>
                          <p class="size-h5">{{ .String "name" }}</p>
                          <p class="size-h6">
                            {{ if .String "@attr.nowplaying" }}
                              <span class="color-positive">Now playing</span>
                            {{ else }}
                              <span class="color-subdue">{{ .String "date.#text" }}</span>
                            {{ end }}
                          </p>
                        </div>
                      </li>
                    {{ end }}
                  </ul>

  custom.css: |
    .header-container {
      display: none;
    }

    /* Mobile bottom bar: keep the column-switch pills and scroll-to-top,
       drop the now-orphaned page-links hamburger and duplicate theme picker */
    .mobile-navigation-page-links,
    .mobile-navigation-actions {
      display: none;
    }

    .mobile-navigation-label:has(.hamburger-icon) {
      display: none;
    }
