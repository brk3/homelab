apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
  namespace: glance
data:
  glance.yml: |
    server:
      assets-path: /app/config

    theme:
      background-color: 230 25 7
      primary-color: 265 85 65
      positive-color: 150 60 45
      negative-color: 350 75 55
      contrast-multiplier: 1.15
      custom-css-file: /assets/custom.css

    pages:
      - name: Home
        hide-desktop-navigation: true
        hide-mobile-navigation: true
        columns:
          - size: small
            widgets:
              - type: calendar
                hide-header: true
                first-day-of-week: monday

              - type: weather
                hide-header: true
                location: Dublin, Ireland
                units: metric
                hour-format: 24h

              - type: clock
                title: World Times
                hour-format: 24h
                timezones:
                  - timezone: Europe/Dublin
                    label: Dublin
                  - timezone: America/New_York
                    label: New York
                  - timezone: America/New_York
                    label: East US
                  - timezone: America/Los_Angeles
                    label: West US
                  - timezone: Asia/Kolkata
                    label: Hyderabad

              - type: custom-api
                title: Last.fm
                hide-header: true
                cache: 60s
                url: http://ws.audioscrobbler.com/2.0/
                parameters:
                  method: user.getRecentTracks
                  user: ${LASTFM_USERNAME}
                  api_key: ${LASTFM_API_KEY}
                  format: json
                  limit: 3
                template: |
                  <ul class="list list-gap-10">
                    {{ range .JSON.Array "recenttracks.track" }}
                      <li class="flex items-center gap-10">
                        <div class="flex-1">
                          <p class="color-positive size-h5">{{ .String "artist.#text" }}</p>
                          <p class="size-h5">{{ .String "name" }}</p>
                          <p class="size-h6">
                            {{ if .String "@attr.nowplaying" }}
                              <span class="color-positive">Now playing</span>
                            {{ else }}
                              <span class="color-subdue">{{ .String "date.#text" }}</span>
                            {{ end }}
                          </p>
                        </div>
                      </li>
                    {{ end }}
                  </ul>

          - size: full
            widgets:
              - type: custom-api
                title: System
                hide-header: true
                cache: 30s
                subrequests:
                  cpu:
                    url: http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/api/v1/query
                    parameters:
                      query: (100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) or vector(0)
                  mem:
                    url: http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/api/v1/query
                    parameters:
                      query: ((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100) or vector(0)
                  disk:
                    url: http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/api/v1/query
                    parameters:
                      query: (100 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100)) or vector(0)
                template: |
                  {{ $cpuVal := (.Subrequest "cpu").JSON.Float "data.result.0.value.1" }}
                  {{ $memVal := (.Subrequest "mem").JSON.Float "data.result.0.value.1" }}
                  {{ $diskVal := (.Subrequest "disk").JSON.Float "data.result.0.value.1" }}
                  <div class="flex justify-between text-center">
                    <div>
                      <div class="size-h3 {{ if gt $cpuVal 85.0 }}color-negative{{ else }}color-highlight{{ end }}">{{ printf "%.0f%%" $cpuVal }}</div>
                      <div class="size-h6">CPU</div>
                    </div>
                    <div>
                      <div class="size-h3 {{ if gt $memVal 90.0 }}color-negative{{ else }}color-highlight{{ end }}">{{ printf "%.0f%%" $memVal }}</div>
                      <div class="size-h6">MEM</div>
                    </div>
                    <div>
                      <div class="size-h3 {{ if gt $diskVal 85.0 }}color-negative{{ else }}color-highlight{{ end }}">{{ printf "%.0f%%" $diskVal }}</div>
                      <div class="size-h6">DISK</div>
                    </div>
                  </div>

              - type: bookmarks
                hide-header: true
                groups:
                  - title: Homelab
                    color: 265 85 65
                    links:
                      - title: Forgejo
                        url: https://forgejo.aiectomy.xyz
                      - title: Grafana
                        url: https://grafana.aiectomy.xyz
                      - title: Alertmanager
                        url: https://alertmanager.aiectomy.xyz
                      - title: Habits
                        url: https://habits.aiectomy.xyz
                  - title: Media
                    color: 265 85 65
                    links:
                      - title: Plex
                        url: https://plex.aiectomy.xyz
                      - title: qBittorrent
                        url: https://qbittorrent.aiectomy.xyz

              - type: group
                widgets:
                  - type: custom-api
                    title: Homelab
                    cache: 10m
                    url: https://api.github.com/repos/brk3/homelab/commits?per_page=20
                    headers:
                      Accept: application/vnd.github+json
                    template: |
                      <ul class="list collapsible-container" data-collapse-after="5" style="--list-gap: 12px;">
                        {{ range $c := .JSON.Array "" }}
                          <li>
                            <a href="{{ $c.String "html_url" }}" target="_blank" rel="noreferrer" class="color-highlight text-truncate block"><span class="color-subdue">{{ slice ($c.String "sha") 0 7 }}</span> {{ $c.String "commit.message" | findMatch "^[^\n]*" }}</a>
                          </li>
                        {{ end }}
                      </ul>
                  - type: custom-api
                    title: Ogma
                    cache: 10m
                    url: https://api.github.com/repos/brk3/ogma/commits?per_page=20
                    headers:
                      Accept: application/vnd.github+json
                    template: |
                      <ul class="list collapsible-container" data-collapse-after="5" style="--list-gap: 12px;">
                        {{ range $c := .JSON.Array "" }}
                          <li>
                            <a href="{{ $c.String "html_url" }}" target="_blank" rel="noreferrer" class="color-highlight text-truncate block"><span class="color-subdue">{{ slice ($c.String "sha") 0 7 }}</span> {{ $c.String "commit.message" | findMatch "^[^\n]*" }}</a>
                          </li>
                        {{ end }}
                      </ul>
                  - type: custom-api
                    title: Brigid
                    cache: 10m
                    url: https://api.github.com/repos/brk3/brigid/commits?per_page=20
                    headers:
                      Accept: application/vnd.github+json
                    template: |
                      <ul class="list collapsible-container" data-collapse-after="5" style="--list-gap: 12px;">
                        {{ range $c := .JSON.Array "" }}
                          <li>
                            <a href="{{ $c.String "html_url" }}" target="_blank" rel="noreferrer" class="color-highlight text-truncate block"><span class="color-subdue">{{ slice ($c.String "sha") 0 7 }}</span> {{ $c.String "commit.message" | findMatch "^[^\n]*" }}</a>
                          </li>
                        {{ end }}
                      </ul>

              - type: group
                widgets:
                  - type: hacker-news
                  - type: lobsters
                  - type: rss
                    title: BBC News
                    feeds:
                      - url: https://feeds.bbci.co.uk/news/rss.xml
                        title: BBC News

          - size: small
            widgets:
              - type: html
                source: |
                  <img src="https://cataas.com/cat?width=400" style="width:100%;border-radius:10px;">

              - type: custom-api
                title: xkcd
                hide-header: true
                cache: 6h
                url: https://xkcd.com/info.0.json
                template: |
                  <a href="https://xkcd.com/{{ .JSON.Int "num" }}/" target="_blank" rel="noreferrer">
                    <img src="{{ .JSON.String "img" }}" title="{{ .JSON.String "alt" }}" style="width:100%;max-height:260px;object-fit:contain;border-radius:10px;">
                  </a>

              - type: markets
                hide-header: true
                symbol-link-template: https://finance.yahoo.com/quote/{SYMBOL}
                markets:
                  - symbol: ORCL
                    name: Oracle
                  - symbol: NOW
                    name: ServiceNow

              - type: custom-api
                title: Quote of the Day
                hide-header: true
                cache: 12h
                url: https://zenquotes.io/api/today
                template: |
                  <blockquote>
                    <p>&ldquo;{{ .JSON.String "0.q" }}&rdquo;</p>
                    <footer class="color-highlight">&mdash; {{ .JSON.String "0.a" }}</footer>
                  </blockquote>

              - type: custom-api
                title: LeetCode Daily Question
                cache: 6h
                url: https://leetcode.com/graphql
                method: POST
                headers:
                  Accept: application/json
                body-type: json
                body:
                  query: |
                    query questionOfToday {
                      activeDailyCodingChallengeQuestion {
                        link
                        question {
                          questionId
                          title
                          difficulty
                        }
                      }
                    }
                  operationName: questionOfToday
                template: |
                  <div>
                    <p class="size-h4">
                      <a href="https://leetcode.com{{ .JSON.String "data.activeDailyCodingChallengeQuestion.link" }}" target="_blank">
                        {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.questionId" }}. {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.title" }}
                      </a>
                    </p>
                    <p class="size-h6 color-highlight">{{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.difficulty" }}</p>
                  </div>


  custom.css: |
    .header-container {
      display: none;
    }

    /* Mobile bottom bar: keep the column-switch pills and scroll-to-top,
       drop the now-orphaned page-links hamburger and duplicate theme picker */
    .mobile-navigation-page-links,
    .mobile-navigation-actions {
      display: none;
    }

    .mobile-navigation-label:has(.hamburger-icon) {
      display: none;
    }

    .clock [data-local-time],
    .clock hr {
      display: none;
    }

    .page-column-small:first-child {
      width: 240px;
    }
