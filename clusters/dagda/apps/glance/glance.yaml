apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  namespace: glance
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      labels:
        app: glance
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: glance
          image: glanceapp/glance:v0.8.5@sha256:abd3a252d538f24afa0759d677d531dedccd4e4239c524202255cf72de80a2be # {"$imagepolicy": "flux-system:glance"}
          env:
            - name: QBITTORRENT_IP
              value: "qbittorrent.media.svc.cluster.local:8080"
            - name: LASTFM_USERNAME
              value: "brk3"
            - name: LASTFM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: glance-lastfm
                  key: LASTFM_API_KEY
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          configMap:
            name: glance-config
---
apiVersion: v1
kind: Service
metadata:
  name: glance
  namespace: glance
spec:
  selector:
    app: glance
  ports:
    - name: http
      port: 8080
      targetPort: 8080
