apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: glance
  namespace: glance
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: glance
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: glance
        maxAllowed:
          memory: 256Mi
