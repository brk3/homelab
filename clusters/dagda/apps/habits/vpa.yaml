apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: habits-frontend
  namespace: habits
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: habits-frontend
  updatePolicy:
    updateMode: "Recreate"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: habits-server
  namespace: habits
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: habits-server
  updatePolicy:
    updateMode: "Recreate"
