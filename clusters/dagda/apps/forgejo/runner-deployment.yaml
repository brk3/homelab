apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
  annotations:
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      initContainers:
        - name: register
          image: code.forgejo.org/forgejo/runner:13.2.0@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552 # {"$imagepolicy": "flux-system:forgejo-runner"}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          workingDir: /data
          command:
            - sh
            - -c
            - |
              test -f /data/.runner && exit 0
              forgejo-runner register \
                --instance https://forgejo.aiectomy.xyz \
                --name dagda \
                --token "$RUNNER_TOKEN" \
                --labels docker \
                --no-interactive
          env:
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-registration
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:13.2.0@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552 # {"$imagepolicy": "flux-system:forgejo-runner"}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://localhost:2375/_ping >/dev/null 2>&1; do
                echo "waiting for dind..."; sleep 2
              done
              exec forgejo-runner --config /data/.runner daemon
          env:
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
        - name: dind
          image: docker:29.7.2-dind@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          args:
            - --host=tcp://0.0.0.0:2375
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1500Mi
      volumes:
        - name: data
          hostPath:
            path: /mnt/k3s-data/appdata/forgejo-runner
            type: Directory
