apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: qbittorrent
  namespace: media
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qbittorrent
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: qbittorrent
        controlledValues: RequestsOnly
        maxAllowed:
          memory: 4Gi
      - containerName: gluetun
        controlledValues: RequestsOnly
        maxAllowed:
          memory: 256Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: plex
  namespace: media
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: plex
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: plex
        # RequestsOnly: VPA only touches requests; the deployment's 4Gi limit stays put.
        # maxAllowed caps the request so it can always schedule (node has ~1.6Gi free).
        controlledValues: RequestsOnly
        maxAllowed:
          memory: 1500Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ogma
  namespace: media
spec:
