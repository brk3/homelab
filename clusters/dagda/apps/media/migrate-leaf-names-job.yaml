apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-leaf-names
  namespace: media
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate-leaf-names
          image: ghcr.io/brk3/ogma:v0.1.3@sha256:d595d7f90679f54925143ee603420c4323d4fd5e46989c85285e84e401c69689
          command: ["python3", "/app/migrate_leaf_names.py"]
          env:
            - name: WATCH_DIR
              value: "/data/downloads/complete"
            - name: TV_ROOT
              value: "/data/tv"
            - name: MOVIES_ROOT
              value: "/data/movies"
          volumeMounts:
            - name: media
              mountPath: /data
      volumes:
        - name: media
          hostPath:
            path: /mnt/media
            type: Directory
