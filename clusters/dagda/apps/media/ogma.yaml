apiVersion: apps/v1
kind: Deployment
metadata:
  name: ogma
  namespace: media
  annotations:
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ogma
  template:
    metadata:
      labels:
        app: ogma
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: ogma
          image: ghcr.io/brk3/ogma:v0.1.2@sha256:16df5aa4c2a33634d62ebeacabe57ae7e3ba4234e435133ed82d78c62bf83bd2 # {"$imagepolicy": "flux-system:ogma"}
          env:
            - name: WATCH_DIR
              value: "/data/downloads/complete"
            - name: TV_ROOT
              value: "/data/tv"
            - name: MOVIES_ROOT
              value: "/data/movies"
          ports:
            - name: health
              containerPort: 8080
          # Liveness only starts once the initial scan has finished, so a slow
          # scan can't be mistaken for a hang.
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: media
              mountPath: /data
      volumes:
        - name: media
          hostPath:
            path: /mnt/media
            type: Directory
