apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 1h
  releaseName: eg
  targetNamespace: envoy-gateway-system
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  values:
    deployment:
      envoyGateway:
        image:
          repository: docker.io/envoyproxy/gateway # {"$imagepolicy": "flux-system:envoy-gateway:name"}
          tag: v1.10.0 # {"$imagepolicy": "flux-system:envoy-gateway:tag"}
        resources:
          limits:
            memory: 512Mi
