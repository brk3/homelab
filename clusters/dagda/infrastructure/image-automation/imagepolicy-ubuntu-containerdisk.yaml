apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: ubuntu-containerdisk
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: ubuntu-containerdisk
  filterTags:
    pattern: '^\d+\.\d+$'
    extract: '$0'
  digestReflectionPolicy: IfNotPresent
  policy:
    alphabetical:
      order: asc
