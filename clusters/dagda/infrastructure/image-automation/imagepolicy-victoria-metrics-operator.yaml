apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: victoria-metrics-operator
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: victoria-metrics-operator
  filterTags:
    pattern: '^v\d+\.\d+\.\d+$'
    extract: '$0'
  digestReflectionPolicy: IfNotPresent
  policy:
    semver:
      # Chart 0.87.0 ships operator v0.73.x CRDs; newer operators wait
      # for vldistributed CRD and crashloop. Raise with the chart.
      range: ">=0.73.0 <0.74.0"
