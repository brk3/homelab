apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: forgejo-runner-dind
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: forgejo-runner-dind
  filterTags:
    pattern: '^\d+\.\d+\.\d+-dind$'
    extract: '$0'
  digestReflectionPolicy: IfNotPresent
  policy:
    semver:
      range: ">=29.0.0-dind"
