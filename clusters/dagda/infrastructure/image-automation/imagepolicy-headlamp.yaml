apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: headlamp
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: headlamp
  filterTags:
    pattern: '^v\d+\.\d+\.\d+$'
    extract: '$0'
  digestReflectionPolicy: IfNotPresent
  policy:
    semver:
      range: ">=0.25.0 <1.0.0"
