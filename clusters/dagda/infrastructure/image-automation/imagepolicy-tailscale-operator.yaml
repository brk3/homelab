apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: tailscale-operator
  filterTags:
    pattern: '^v\d+\.\d+\.\d+$'
    extract: '$0'
  digestReflectionPolicy: IfNotPresent
  policy:
    semver:
      range: ">=1.50.0"
