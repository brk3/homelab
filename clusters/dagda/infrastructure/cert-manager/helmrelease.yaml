apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: cert-manager
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: cert-manager
  values:
    crds:
      enabled: true
