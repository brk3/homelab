apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: headlamp
  install:
    createNamespace: true
  chart:
    spec:
      chart: headlamp
      version: "0.46.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  values:
    # WARNING: no login. Every visitor is authenticated as the pod's service
    # account, which is bound to cluster-admin. Publicly routed at
    # headlamp.aiectomy.xyz - anyone who finds it owns the cluster.
    config:
      unsafeUseServiceAccountToken: true
    httpRoute:
      enabled: true
      parentRefs:
        - name: eg
          namespace: envoy-gateway-system
      hostnames:
        - headlamp.aiectomy.xyz
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
