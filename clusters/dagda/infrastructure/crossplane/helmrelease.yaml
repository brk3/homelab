apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: crossplane-system
  install:
    createNamespace: true
  chart:
    spec:
      chart: crossplane
      version: "2.4.0"
      sourceRef:
        kind: HelmRepository
        name: crossplane
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/crossplane/crossplane # {"$imagepolicy": "flux-system:crossplane:name"}
      tag: v2.5.0 # {"$imagepolicy": "flux-system:crossplane:tag"}
