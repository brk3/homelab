apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vpa-webhook-selfsigned
  namespace: vpa
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vpa-webhook-cert
  namespace: vpa
spec:
  secretName: vpa-tls-certs
  dnsNames:
    - vpa-webhook.vpa
    - vpa-webhook.vpa.svc
    - vpa-webhook.vpa.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: vpa-webhook-selfsigned
