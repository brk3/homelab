apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: vpa
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: vpa
  values:
    # Full deployment (recommender + updater + admission controller) so
    # VPAs with updateMode: Recreate can evict/restart pods to apply sizing.
    recommenderOnly: false
    updater:
      extraArgs:
        - --min-replicas=1
        - --feature-gates=InPlaceOrRecreate=true
    admissionController:
      extraArgs:
        - --feature-gates=InPlaceOrRecreate=true
