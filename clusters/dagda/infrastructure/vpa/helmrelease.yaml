apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: vpa
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: vpa
  values:
    # Recommender-only: generates sizing recommendations without an
    # updater/admission-controller, so pods are never evicted/restarted
    # to apply them. Recommendations are read via `kubectl describe vpa`.
    recommenderOnly: true
