apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: virt-operator
  namespace: kubevirt
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: virt-operator
  updatePolicy:
    updateMode: "Recreate"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: virt-api
  namespace: kubevirt
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: virt-api
  updatePolicy:
    updateMode: "Recreate"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: virt-controller
  namespace: kubevirt
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: virt-controller
  updatePolicy:
    updateMode: "Recreate"
