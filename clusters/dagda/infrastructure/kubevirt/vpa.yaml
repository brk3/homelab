apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: virt-operator
  namespace: kubevirt
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: virt-operator
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: virt-operator
        maxAllowed:
          memory: 512Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: virt-api
  namespace: kubevirt
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: virt-api
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: virt-api
        maxAllowed:
          memory: 512Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: virt-controller
  namespace: kubevirt
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: virt-controller
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: virt-controller
        maxAllowed:
          memory: 512Mi
