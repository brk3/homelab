apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: kured
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: kured
  values:
    configuration:
      timeZone: Europe/Dublin
      startTime: "03:00"
      endTime: "05:00"
      period: 15m
      drainTimeout: 5m
      forceReboot: true
      skipWaitForDeleteTimeout: 60
      annotateNodes: true
      prometheusUrl: http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring.svc:8428
      alertFiringOnly: true
      alertFilterRegexp: ^(Watchdog|InfoInhibitor|RecordingRulesNoData)$
    extraEnvVars:
      - name: KURED_NOTIFY_URL
        valueFrom:
          secretKeyRef:
            name: kured-secret
            key: notify-url
    service:
      create: true
      port: 8080
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
