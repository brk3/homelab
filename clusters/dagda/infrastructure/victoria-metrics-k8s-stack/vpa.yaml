apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: monitoring-victoria-metrics-k8s-stack-kube-state-metrics
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: kube-state-metrics
        maxAllowed:
          memory: 512Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vmagent
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vmagent-monitoring-victoria-metrics-k8s-stack
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: vmagent
        maxAllowed:
          memory: 1500Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vmsingle
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vmsingle-monitoring-victoria-metrics-k8s-stack
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: vmsingle
        maxAllowed:
          memory: 4Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: grafana
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: monitoring-victoria-metrics-k8s-stack-grafana
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: grafana
        maxAllowed:
          memory: 1500Mi
      - containerName: grafana-sc-dashboard
        maxAllowed:
          memory: 256Mi
      - containerName: grafana-sc-datasources
        maxAllowed:
          memory: 256Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vmalert
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vmalert-monitoring-victoria-metrics-k8s-stack
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: vmalert
        maxAllowed:
          memory: 512Mi
      - containerName: config-reloader
        maxAllowed:
          memory: 256Mi
# No VPA for vmauth-internal: its VMAuth CR (and Deployment) only renders
# when both a metrics AND a VictoriaLogs read endpoint exist. VictoriaLogs
# is disabled (see helmrelease.yaml), so this component is never deployed.
