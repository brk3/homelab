apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  values:
    # Alertmanager config (routes + Telegram receiver + bot token/chat ID)
    # lives in the "alertmanager-telegram-config" Secret, created directly
    # in-cluster rather than here, so credentials never land in git.
    alertmanager:
      spec:
        configSecret: alertmanager-telegram-config
        resources:
          requests:
            cpu: 30m
            memory: 64Mi
          limits:
            memory: 256Mi
    vmsingle:
      spec:
        retentionPeriod: "3"
        resources:
          requests:
            cpu: 150m
            memory: 1200Mi
          limits:
            memory: 2400Mi
    # vlsingle:
    #   enabled: true
    #   spec:
    #     extraArgs:
    #       retention.maxDiskSpaceUsageBytes: 4GiB
    #     storage:
    #       resources:
    #         requests:
    #           storage: 5Gi
    #     resources:
    #       requests:
    #         cpu: 150m
    #         memory: 500Mi
    #       limits:
    #         memory: 1500Mi
    #   route:
    #     enabled: true
    #     parentRefs:
    #       - name: eg
    #         namespace: envoy-gateway-system
    #     hostnames:
    #       - logs.aiectomy.xyz
    # vlagent:
    #   enabled: true
    #   spec:
    #     resources:
    #       requests:
    #         cpu: 50m
    #         memory: 200Mi
    #       limits:
    #         memory: 500Mi
    vmagent:
      spec:
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            memory: 600Mi
    vmalert:
      spec:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 400Mi
    internal:
      vmauth:
        spec:
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              memory: 200Mi
    grafana:
      persistence:
        enabled: true
        size: 2Gi
      plugins:
        - victoriametrics-logs-datasource
      resources:
        requests:
          cpu: 50m
          memory: 700Mi
        limits:
          memory: 1200Mi
      sidecar:
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 256Mi
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 40Mi
        limits:
          memory: 80Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
    victoria-metrics-operator:
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 256Mi
    # KubeVirt's node-labeller stamps ~400 cpu-feature/machine-type labels
    # (*_kubevirt_io_*) onto every node. The chart's default kubelet
    # VMNodeScrape copies all node labels onto every scraped series via
    # labelmap, which pushes cadvisor/kubelet series past VictoriaMetrics'
    # default 40-label-per-series limit, so they get silently dropped -
    # this is why kubelet/cadvisor-derived dashboards (e.g. Compute
    # Resources / Pod) show "No Data" despite scraping showing healthy.
    kubelet:
      vmScrape:
        spec:
          metricRelabelConfigs:
            - action: labeldrop
              regex: (uid)
            - action: labeldrop
              regex: (id|name)
            - action: drop
              source_labels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
            - action: labeldrop
              regex: .*kubevirt_io.*
