apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  values:
    vmsingle:
      spec:
        retentionPeriod: "3"
    grafana:
      persistence:
        enabled: true
        size: 2Gi
