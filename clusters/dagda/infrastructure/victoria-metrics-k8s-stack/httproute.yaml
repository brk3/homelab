apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
  hostnames:
    - grafana.aiectomy.xyz
  rules:
    - backendRefs:
        - name: monitoring-victoria-metrics-k8s-stack-grafana
          port: 80
---
# NOTE: Alertmanager's UI has no built-in auth - anyone who resolves this
# hostname can view and silence alerts.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
  hostnames:
    - alertmanager.aiectomy.xyz
  rules:
    - backendRefs:
        - name: vmalertmanager-monitoring-victoria-metrics-k8s-stack
          port: 9093
