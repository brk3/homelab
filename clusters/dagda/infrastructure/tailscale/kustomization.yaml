apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/tailscale/tailscale/v1.104.7/cmd/k8s-operator/deploy/crds/tailscale.com_connectors.yaml
  - https://raw.githubusercontent.com/tailscale/tailscale/v1.104.7/cmd/k8s-operator/deploy/crds/tailscale.com_dnsconfigs.yaml
  - https://raw.githubusercontent.com/tailscale/tailscale/v1.104.7/cmd/k8s-operator/deploy/crds/tailscale.com_peerrelays.yaml
  - https://raw.githubusercontent.com/tailscale/tailscale/v1.104.7/cmd/k8s-operator/deploy/crds/tailscale.com_proxyclasses.yaml
  - https://raw.githubusercontent.com/tailscale/tailscale/v1.104.7/cmd/k8s-operator/deploy/crds/tailscale.com_proxygrouppolicies.yaml
  - https://raw.githubusercontent.com/tailscale/tailscale/v1.104.7/cmd/k8s-operator/deploy/crds/tailscale.com_proxygroups.yaml
  - https://raw.githubusercontent.com/tailscale/tailscale/v1.104.7/cmd/k8s-operator/deploy/crds/tailscale.com_recorders.yaml
  - https://raw.githubusercontent.com/tailscale/tailscale/v1.104.7/cmd/k8s-operator/deploy/crds/tailscale.com_tailnets.yaml
  - operator.yaml
  - proxyclass.yaml
  - secret.yaml
  - connector.yaml
patches:
  - target:
      kind: Deployment
      name: operator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: dagda-tailscale-operator
      - op: replace
        path: /spec/template/spec/containers/0/env/10/value
        value: tailscale/tailscale:v1.104.7
      - op: replace
        path: /spec/template/spec/containers/0/env/11/value
        value: tag:k8s-operator
