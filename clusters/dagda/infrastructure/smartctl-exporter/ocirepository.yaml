apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: smartctl-exporter
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/prometheus-community/charts/prometheus-smartctl-exporter
  ref:
    # NOTE: 0.17.1 publishes its OCI artifact layers in provenance-then-content
    # order, which trips flux source-controller v1.9.4's "requires
    # gzip-compressed body" extraction (it expects the content layer first).
    # 0.17.0 has the same content (only the provenance/signing metadata
    # differs) with the correct layer order, so pin to that instead.
    tag: 0.17.0
