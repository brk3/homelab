apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: smart-alerts
  namespace: monitoring
spec:
  groups:
    - name: smart
      rules:
        # smartctl_device_smart_status is the drive's own overall PASSED/FAILED
        # verdict (1 = healthy), so any other value means the drive itself is
        # reporting trouble.
        - alert: SmartDeviceUnhealthy
          expr: smartctl_device_smart_status == 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Device {{ $labels.device }} on {{ $labels.instance }} failed its overall SMART health check"
        - alert: SmartReallocatedSectorsPresent
          expr: smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct", attribute_value_type="raw"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Device {{ $labels.device }} on {{ $labels.instance }} has reallocated sectors ({{ $value }})"
        - alert: SmartPendingSectorsPresent
          expr: smartctl_device_attribute{attribute_name="Current_Pending_Sector", attribute_value_type="raw"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Device {{ $labels.device }} on {{ $labels.instance }} has pending sectors awaiting remap ({{ $value }})"
        - alert: SmartUncorrectableSectors
          expr: smartctl_device_attribute{attribute_name="Offline_Uncorrectable", attribute_value_type="raw"} > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Device {{ $labels.device }} on {{ $labels.instance }} has uncorrectable sectors ({{ $value }}) - data loss risk"
        # The following four are NVMe-only counters (SATA devices never
        # produce these series, so the rules simply never fire for them).
        - alert: SmartNvmeMediaErrors
          expr: smartctl_device_media_errors != 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "NVMe device {{ $labels.device }} on {{ $labels.instance }} has media errors"
        - alert: SmartNvmeCriticalWarning
          expr: smartctl_device_critical_warning != 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "NVMe device {{ $labels.device }} on {{ $labels.instance }} reports a critical controller warning"
        - alert: SmartNvmeAvailableSpareLow
          expr: smartctl_device_available_spare_threshold > smartctl_device_available_spare
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "NVMe device {{ $labels.device }} on {{ $labels.instance }} has dropped below its available spare threshold"
        - alert: SmartDeviceTemperatureHigh
          expr: smartctl_device_temperature{temperature_type="current"} > 60
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Device {{ $labels.device }} on {{ $labels.instance }} temperature is {{ $value }}°C"
        # Catches the exporter itself dying (disk unplugged, container
        # crash-looping, etc.) - without this, a dead exporter just looks
        # like "no alerts", which is indistinguishable from "all healthy".
        - alert: SmartExporterDown
          expr: up{job=~".*smartctl-exporter.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "smartctl-exporter on {{ $labels.instance }} is down - SMART monitoring is blind"
