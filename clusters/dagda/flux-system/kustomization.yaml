apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
  - target:
      kind: Deployment
      name: (helm-controller|kustomize-controller|notification-controller|source-controller)
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 400Mi
